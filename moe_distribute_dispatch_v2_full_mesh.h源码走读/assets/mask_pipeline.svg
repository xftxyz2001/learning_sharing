<text x="1240.0" y="544" text-anchor="middle" class="sm">sendToMoeExpTokenCnt_</text>
<path d="M260 570V790H650" class="arr"/>
<path d="M750 565V790" class="arr"/>
<path d="M1240 560V790H850" class="arr"/>
<rect x="520" y="780" width="460" height="78" rx="11" fill="#f3e8ff" stroke="#a78bfa" class=""/>
<text x="750.0" y="807" text-anchor="middle" class="b">Select(mask, expertIds, -1)</text>
<text x="750.0" y="829" text-anchor="middle" class="sm">validExpertIdsTensor_ 保持原 [BS,K] 位置</text>
