<rect x="80" y="285" width="360" height="65" rx="11" fill="#fff" stroke="#93c5fd" class=""/>
<text x="260.0" y="312" text-anchor="middle" class="b">DataCopyPad + Cast</text>
<text x="260.0" y="334" text-anchor="middle" class="sm">bool → half</text>
<path d="M260 350L260 390" class="arr"/>
<rect x="80" y="390" width="360" height="65" rx="11" fill="#dbeafe" stroke="#60a5fa" class=""/>
<text x="260.0" y="417" text-anchor="middle" class="b">Sum(BS)</text>
<text x="260.0" y="439" text-anchor="middle" class="sm">activeMaskBsCnt_</text>
<path d="M260 455L260 495" class="arr"/>
<rect x="80" y="495" width="360" height="75" rx="11" fill="#bfdbfe" stroke="#3b82f6" class=""/>
<text x="260.0" y="522" text-anchor="middle" class="b">前 activeBS × K 项</text>
<text x="260.0" y="544" text-anchor="middle" class="sm">有效 Token 必须前部连续</text>
<rect x="530" y="215" width="440" height="520" rx="18" fill="#f0fdf4" stroke="#4ade80" class="box"/>
