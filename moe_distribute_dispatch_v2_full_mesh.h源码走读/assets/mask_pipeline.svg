<text x="1240.0" y="334" text-anchor="middle" class="sm">zero-expert bit mask</text>
<path d="M1240 350L1240 390" class="arr"/>
<rect x="1060" y="390" width="360" height="65" rx="11" fill="#ffedd5" stroke="#fb923c" class=""/>
