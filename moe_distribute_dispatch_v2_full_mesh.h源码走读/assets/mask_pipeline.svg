<text x="250.0" y="112" text-anchor="middle" class="b">expertIds GM</text>
<text x="250.0" y="134" text-anchor="middle" class="sm">展平 [BS,K]</text>
<rect x="570" y="85" width="360" height="72" rx="11" fill="#dcfce7" stroke="#4ade80" class=""/>
<text x="750.0" y="112" text-anchor="middle" class="b">xActiveMask GM</text>
<text x="750.0" y="134" text-anchor="middle" class="sm">[BS] 或 [BS,K]</text>
<rect x="1070" y="85" width="360" height="72" rx="11" fill="#ffedd5" stroke="#fb923c" class=""/>
<text x="1250.0" y="112" text-anchor="middle" class="b">tiling flags</text>
<text x="1250.0" y="134" text-anchor="middle" class="sm">token / expert / zero</text>
<rect x="40" y="215" width="440" height="520" rx="18" fill="#eff6ff" stroke="#60a5fa" class="box"/>
