<path d="M750 350L750 390" class="arr"/>
<rect x="570" y="390" width="360" height="65" rx="11" fill="#dcfce7" stroke="#4ade80" class=""/>
<text x="750.0" y="417" text-anchor="middle" class="b">GatherMask(BS index)</text>
<text x="750.0" y="439" text-anchor="middle" class="sm">validBsIndexTensor_</text>
