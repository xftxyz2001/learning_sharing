<text x="1127.0" y="196" text-anchor="middle" class="b" fill="#fff">status 4</text>
<text x="1127.0" y="219" text-anchor="middle" class="sm" fill="#fff">core 2</text>
<rect x="1220" y="165" width="170" height="72" rx="5" fill="#7c3aed" stroke="#7c3aed" class=""/>
