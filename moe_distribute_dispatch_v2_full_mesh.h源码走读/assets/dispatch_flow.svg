<rect x="90" y="345" width="580" height="72" rx="11" fill="#fff" stroke="#86efac" class=""/>
<text x="380.0" y="372" text-anchor="middle" class="b">virtualToken = sharedExpert × activeBS</text>
<text x="380.0" y="394" text-anchor="middle" class="sm">SplitToCore 分给 sharedUsedAivNum_</text>
