<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">LocalWindowCopy 将稀疏来源槽位连续化</title>
  <desc id="desc">不同源 Rank 在专家 Window 中使用彼此独立的预留槽位，产生空洞；LocalWindowCopy 等待前缀和与 Token 到达标志后，只复制有效槽位并形成按专家连续的输出。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".12"/></filter><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.title{font-size:24px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:14px;fill:#334155}.sm{font-size:12px;fill:#64748b}.token{font-size:12px;font-weight:700;fill:#fff}.box{filter:url(#s);stroke-width:1.5}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1500" height="720" fill="#f8fafc"/><text x="750" y="42" text-anchor="middle" class="title">LocalWindowCopy：把“各来源独占的停车位”压成专家可直接计算的连续队列</text>
  <rect x="35" y="90" width="535" height="535" rx="20" fill="#eff6ff" stroke="#60a5fa" class="box"/>
  <text x="65" y="130" class="h">1. 接收 Window：容量固定、有效数据稀疏</text>
  <text x="65" y="160" class="b">以 localExpert E2 为例，每个来源预留 4 个 slot</text>
  <g transform="translate(75,205)">
    <text x="0" y="28" class="b">R0</text><rect x="55" y="0" width="75" height="55" rx="8" fill="#2563eb"/><text x="93" y="33" text-anchor="middle" class="token">T0</text><rect x="140" y="0" width="75" height="55" rx="8" fill="#2563eb"/><text x="178" y="33" text-anchor="middle" class="token">T7</text><rect x="225" y="0" width="75" height="55" rx="8" fill="#e2e8f0"/><rect x="310" y="0" width="75" height="55" rx="8" fill="#e2e8f0"/>
    <text x="0" y="113" class="b">R1</text><rect x="55" y="85" width="75" height="55" rx="8" fill="#e2e8f0"/><rect x="140" y="85" width="75" height="55" rx="8" fill="#e2e8f0"/><rect x="225" y="85" width="75" height="55" rx="8" fill="#e2e8f0"/><rect x="310" y="85" width="75" height="55" rx="8" fill="#e2e8f0"/>
    <text x="0" y="198" class="b">R2</text><rect x="55" y="170" width="75" height="55" rx="8" fill="#0284c7"/><text x="93" y="203" text-anchor="middle" class="token">T3</text><rect x="140" y="170" width="75" height="55" rx="8" fill="#0284c7"/><text x="178" y="203" text-anchor="middle" class="token">T8</text><rect x="225" y="170" width="75" height="55" rx="8" fill="#0284c7"/><text x="263" y="203" text-anchor="middle" class="token">T9</text><rect x="310" y="170" width="75" height="55" rx="8" fill="#e2e8f0"/>
  </g>
  <rect x="75" y="465" width="455" height="115" rx="12" fill="#fff" stroke="#bfdbfe"/>
  <text x="303" y="497" text-anchor="middle" class="b">count = [2, 0, 3]</text><text x="303" y="527" text-anchor="middle" class="b">prefix = [2, 2, 5]</text><text x="303" y="557" text-anchor="middle" class="sm">灰色槽位不会出现在 expandXOut</text>

  <rect x="645" y="90" width="310" height="535" rx="20" fill="#fff7ed" stroke="#fb923c" class="box"/>
  <text x="800" y="130" text-anchor="middle" class="h">2. LocalWindowCopy()</text>
  <rect x="685" y="180" width="230" height="65" rx="11" fill="#fff" stroke="#fdba74"/><text x="800" y="207" text-anchor="middle" class="b">WaitCumSumFlag()</text><text x="800" y="229" text-anchor="middle" class="sm">前缀和已经可读</text>
  <path d="M800 245V282" class="arr"/>
  <rect x="685" y="285" width="230" height="75" rx="11" fill="#fff" stroke="#fdba74"/><text x="800" y="313" text-anchor="middle" class="b">SetValidExpertInfo()</text><text x="800" y="337" text-anchor="middle" class="sm">count 差分，过滤 0 长度来源</text>
  <path d="M800 360V397" class="arr"/>
  <rect x="685" y="400" width="230" height="75" rx="11" fill="#fff" stroke="#fdba74"/><text x="800" y="428" text-anchor="middle" class="b">WaitAndFormatOutput()</text><text x="800" y="452" text-anchor="middle" class="sm">轮询 Token flag，批量 Copy</text>
  <path d="M800 475V512" class="arr"/>
  <rect x="685" y="515" width="230" height="65" rx="11" fill="#ffedd5" stroke="#fb923c"/><text x="800" y="542" text-anchor="middle" class="b">清 flag / 更新剩余量</text><text x="800" y="564" text-anchor="middle" class="sm">供下一轮复用 Window</text>
  <path d="M570 350H640" class="arr"/><path d="M955 350H1025" class="arr"/>

  <rect x="1030" y="90" width="435" height="535" rx="20" fill="#f0fdf4" stroke="#4ade80" class="box"/>
  <text x="1060" y="130" class="h">3. 连续输出：专家可直接进入 GMM / FFN</text>
  <text x="1060" y="160" class="b">E2 的 expandXOut 区间 [0, 5)</text>
  <g transform="translate(1080,220)">
    <rect x="0" y="0" width="65" height="70" rx="9" fill="#2563eb"/><text x="33" y="40" text-anchor="middle" class="token">T0</text>
    <rect x="72" y="0" width="65" height="70" rx="9" fill="#2563eb"/><text x="105" y="40" text-anchor="middle" class="token">T7</text>
    <rect x="144" y="0" width="65" height="70" rx="9" fill="#0284c7"/><text x="177" y="40" text-anchor="middle" class="token">T3</text>
    <rect x="216" y="0" width="65" height="70" rx="9" fill="#0284c7"/><text x="249" y="40" text-anchor="middle" class="token">T8</text>
    <rect x="288" y="0" width="65" height="70" rx="9" fill="#0284c7"/><text x="321" y="40" text-anchor="middle" class="token">T9</text>
    <g class="sm" text-anchor="middle"><text x="33" y="95">0</text><text x="105" y="95">1</text><text x="177" y="95">2</text><text x="249" y="95">3</text><text x="321" y="95">4</text></g>
  </g>
  <rect x="1070" y="365" width="355" height="170" rx="12" fill="#fff" stroke="#86efac"/>
  <text x="1248" y="400" text-anchor="middle" class="b">伴随输出同时整理</text>
  <text x="1100" y="435" class="sm">• expandIdx：记录原 srcRank / token / k</text>
  <text x="1100" y="465" class="sm">• dynamic scale / expert scale（按模式）</text>
  <text x="1100" y="495" class="sm">• expertTokenNums / sendCounts 等计数信息</text>
  <text x="750" y="685" text-anchor="middle" class="sm">融合没有消灭重排；它把发送前的全局重排，变成了可与通信重叠的远端写入 + 接收侧连续化</text>
</svg>
