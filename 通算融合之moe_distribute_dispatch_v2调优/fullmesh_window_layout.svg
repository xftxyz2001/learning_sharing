<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">full-mesh 数据 Window 与状态 Window 的逻辑布局</title>
  <desc id="desc">Token 数据按源 Rank、本地专家和预留槽位组织；状态按本地专家和源 Rank 组织，每个状态块为 32 字节，包含 flag 和 token count。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".12"/></filter>
  <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.title{font-size:24px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:14px;fill:#334155}.sm{font-size:12px;fill:#64748b}.mono{font-family:Consolas,"Microsoft YaHei",monospace;font-size:13px}.box{filter:url(#s);stroke-width:1.5}.arr{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:7 5}</style></defs>
  <rect width="1500" height="820" fill="#f8fafc"/><text x="750" y="42" text-anchor="middle" class="title">full-mesh 接收侧看到两套空间：Token 数据槽位 + count 状态块</text>

  <rect x="35" y="80" width="850" height="645" rx="20" fill="#eff6ff" stroke="#60a5fa" class="box"/>
  <text x="70" y="120" class="h">A. 数据 Window：逻辑键为 (srcRank, localExpert, slot)</text>
  <text x="70" y="150" class="b">源码地址：srcRank × localExpertNum + localExpertIdx，再加 slot × hCommuSize</text>
  <g transform="translate(75,190)">
    <text x="0" y="-15" class="b">目标 Rank 上的接收空间</text>
    <rect x="0" y="0" width="760" height="395" rx="14" fill="#fff" stroke="#93c5fd"/>
    <text x="18" y="38" class="h">srcRank 0</text>
    <rect x="135" y="15" width="285" height="92" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="150" y="43" class="b">localExpert 0</text><rect x="150" y="57" width="60" height="32" rx="5" fill="#2563eb"/><text x="180" y="78" text-anchor="middle" fill="#fff" class="sm">slot 0</text><rect x="218" y="57" width="60" height="32" rx="5" fill="#93c5fd"/><text x="248" y="78" text-anchor="middle" class="sm">slot 1</text><text x="300" y="78" class="b">…</text><rect x="330" y="57" width="72" height="32" rx="5" fill="#e2e8f0"/><text x="366" y="78" text-anchor="middle" class="sm">空槽位</text>
    <rect x="445" y="15" width="285" height="92" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="460" y="43" class="b">localExpert 1</text><rect x="460" y="57" width="60" height="32" rx="5" fill="#2563eb"/><text x="490" y="78" text-anchor="middle" fill="#fff" class="sm">slot 0</text><text x="545" y="78" class="b">…</text><rect x="625" y="57" width="85" height="32" rx="5" fill="#e2e8f0"/><text x="668" y="78" text-anchor="middle" class="sm">预留到 maxBS</text>

    <text x="18" y="175" class="h">srcRank 1</text>
    <rect x="135" y="150" width="285" height="92" rx="10" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="150" y="178" class="b">localExpert 0</text><rect x="150" y="192" width="60" height="32" rx="5" fill="#0284c7"/><text x="180" y="213" text-anchor="middle" fill="#fff" class="sm">slot 0</text><text x="235" y="213" class="b">…</text><rect x="330" y="192" width="72" height="32" rx="5" fill="#e2e8f0"/><text x="366" y="213" text-anchor="middle" class="sm">空槽位</text>
    <rect x="445" y="150" width="285" height="92" rx="10" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="460" y="178" class="b">localExpert 1</text><rect x="460" y="192" width="60" height="32" rx="5" fill="#0284c7"/><text x="490" y="213" text-anchor="middle" fill="#fff" class="sm">slot 0</text><rect x="528" y="192" width="60" height="32" rx="5" fill="#7dd3fc"/><text x="558" y="213" text-anchor="middle" class="sm">slot 1</text><text x="610" y="213" class="b">…</text>

    <text x="18" y="310" class="h">… srcRank N-1</text>
    <rect x="135" y="285" width="595" height="75" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="7 5"/>
    <text x="432" y="330" text-anchor="middle" class="b">每个来源都有独立预留区，因此发送时不需要先知道其他来源的 count</text>
  </g>
  <rect x="75" y="620" width="770" height="70" rx="12" fill="#fff" stroke="#bfdbfe"/>
  <text x="460" y="648" text-anchor="middle" class="b">每个 Token 块 = payload + (srcRank, tokenIdx, kIdx) 等元数据 + 到达标志</text>
  <text x="460" y="676" text-anchor="middle" class="sm">代价：各来源预留 maxBS 容量，实际数据之间会有空洞，后面必须连续化</text>

  <rect x="925" y="80" width="540" height="645" rx="20" fill="#fff7ed" stroke="#fb923c" class="box"/>
  <text x="960" y="120" class="h">B. 状态 Window：逻辑键为 (localExpert, srcRank)</text>
  <text x="960" y="150" class="b">每个 cell 固定 32 B = 8 × int32</text>
  <g transform="translate(975,190)">
    <text x="155" y="-10" text-anchor="middle" class="b">srcRank</text>
    <text x="115" y="22" text-anchor="middle" class="sm">R0</text><text x="215" y="22" text-anchor="middle" class="sm">R1</text><text x="315" y="22" text-anchor="middle" class="sm">R2</text><text x="415" y="22" text-anchor="middle" class="sm">…</text>
    <text x="-8" y="87" text-anchor="middle" transform="rotate(-90 -8 87)" class="b">localExpert</text>
    <text x="30" y="70" class="sm">E0</text><text x="30" y="140" class="sm">E1</text><text x="30" y="210" class="sm">…</text>
    <g fill="#ffedd5" stroke="#fb923c"><rect x="65" y="40" width="90" height="48" rx="7"/><rect x="165" y="40" width="90" height="48" rx="7"/><rect x="265" y="40" width="90" height="48" rx="7"/><rect x="365" y="40" width="90" height="48" rx="7"/><rect x="65" y="110" width="90" height="48" rx="7"/><rect x="165" y="110" width="90" height="48" rx="7"/><rect x="265" y="110" width="90" height="48" rx="7"/><rect x="365" y="110" width="90" height="48" rx="7"/><rect x="65" y="180" width="90" height="48" rx="7"/><rect x="165" y="180" width="90" height="48" rx="7"/><rect x="265" y="180" width="90" height="48" rx="7"/><rect x="365" y="180" width="90" height="48" rx="7"/></g>
    <g class="sm" text-anchor="middle"><text x="110" y="70">flag,cnt</text><text x="210" y="70">flag,cnt</text><text x="310" y="70">flag,cnt</text><text x="410" y="70">…</text><text x="110" y="140">flag,cnt</text><text x="210" y="140">flag,cnt</text><text x="310" y="140">flag,cnt</text><text x="410" y="140">…</text><text x="110" y="210">…</text><text x="210" y="210">…</text><text x="310" y="210">…</text><text x="410" y="210">…</text></g>
  </g>
  <path d="M1195 435V470" class="arr"/>
  <rect x="970" y="475" width="450" height="85" rx="12" fill="#fff" stroke="#fdba74"/>
  <text x="1195" y="505" text-anchor="middle" class="mono">[0] flag = bit-pattern(float 1.0)</text>
  <text x="1195" y="532" text-anchor="middle" class="mono">[1] tokenCnt　 [2..7] padding</text>
  <rect x="970" y="585" width="450" height="105" rx="12" fill="#ffedd5" stroke="#fb923c"/>
  <text x="1195" y="617" text-anchor="middle" class="b">为什么“每 8 个数设置一个”？</text>
  <text x="1195" y="647" text-anchor="middle" class="sm">一个状态块恰好 8 个 int32，mask 每跨 8 个元素</text>
  <text x="1195" y="674" text-anchor="middle" class="sm">命中块首元素，所以只改每个块的 flag，不碰 count</text>

  <path d="M885 405H925" class="arr dash"/>
  <text x="750" y="785" text-anchor="middle" class="sm">状态布局和数据布局的轴顺序不同；阅读偏移公式时要分别看，不能把两个 Window 当成同一个二维数组</text>
</svg>
