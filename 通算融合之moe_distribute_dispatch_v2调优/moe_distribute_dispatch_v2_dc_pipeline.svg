<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="470" viewBox="0 0 1600 470" role="img" aria-labelledby="title desc">
  <title id="title">MoE Dispatch FFN Combine 五阶段流程</title>
  <desc id="desc">输入、Router Gate、Dispatch、本地专家计算、Combine 和输出 Token 横向排列。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .step{font-size:18px;font-weight:700}.body{font-size:14px;fill:#334155}.small{font-size:12px;fill:#64748b}
      .box{stroke-width:1.5;filter:url(#shadow)}.arrow{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="470" fill="url(#bg)"/>

  <rect class="box" x="35" y="105" width="225" height="245" rx="18" fill="#fff" stroke="#cbd5e1"/>
  <circle cx="70" cy="140" r="20" fill="#334155"/><text x="70" y="147" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1</text>
  <text x="105" y="147" class="step">输入（本地切片）</text>
  <rect x="68" y="190" width="158" height="34" rx="8" fill="#f1f5f9"/><text x="147" y="212" text-anchor="middle" class="body">X[localBS, H]</text>
  <rect x="68" y="240" width="158" height="34" rx="8" fill="#e2e8f0"/><text x="147" y="262" text-anchor="middle" class="body">本 Rank Token</text>
  <text x="147" y="310" text-anchor="middle" class="small">Expert Parallel 本地切片</text>

  <rect class="box" x="300" y="105" width="250" height="245" rx="18" fill="#fff" stroke="#c4b5fd"/>
  <circle cx="335" cy="140" r="20" fill="#7c3aed"/><text x="335" y="147" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text>
  <text x="370" y="147" class="step">Router / Gate</text>
  <path d="M340 206C380 172 433 172 505 206C442 244 389 244 340 206Z" fill="#ede9fe" stroke="#a78bfa"/>
  <circle cx="385" cy="205" r="8" fill="#8b5cf6"/><circle cx="424" cy="194" r="8" fill="#8b5cf6"/><circle cx="470" cy="217" r="8" fill="#8b5cf6"/>
  <text x="425" y="277" text-anchor="middle" class="body">为每个 Token 选择 Top-K 专家</text>
  <text x="425" y="305" text-anchor="middle" class="body">产生 expertIds 和路由权重</text>

  <rect class="box" x="590" y="80" width="300" height="295" rx="18" fill="#dbeafe" stroke="#60a5fa"/>
  <circle cx="625" cy="115" r="20" fill="#2563eb"/><text x="625" y="122" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">3</text>
  <text x="660" y="122" class="step">Dispatch（下发）</text>
  <rect x="625" y="164" width="230" height="46" rx="10" fill="#fff" stroke="#93c5fd"/><text x="740" y="192" text-anchor="middle" class="body">按路由统计并交换专家计数</text>
  <rect x="625" y="226" width="230" height="46" rx="10" fill="#fff" stroke="#93c5fd"/><text x="740" y="254" text-anchor="middle" class="body">把 Token 送到专家所在卡</text>
  <rect x="625" y="288" width="230" height="54" rx="10" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="740" y="310" text-anchor="middle" class="body">接收端按专家连续密排</text><text x="740" y="330" text-anchor="middle" class="small">生成 expandX / expandIdx / counts</text>

  <rect class="box" x="930" y="105" width="235" height="245" rx="18" fill="#fff7ed" stroke="#fbbf24"/>
  <circle cx="965" cy="140" r="20" fill="#d97706"/><text x="965" y="147" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">4</text>
  <text x="1000" y="147" class="step">本地专家计算</text>
  <rect x="970" y="190" width="155" height="82" rx="13" fill="#fff" stroke="#f59e0b"/>
  <text x="1048" y="222" text-anchor="middle" font-size="18" font-weight="700">GMM / FFN</text>
  <text x="1048" y="250" text-anchor="middle" class="small">按专家分组计算</text>
  <text x="1048" y="310" text-anchor="middle" class="small">处理本 Rank 部署的专家</text>

  <rect class="box" x="1205" y="80" width="355" height="295" rx="18" fill="#dcfce7" stroke="#4ade80"/>
  <circle cx="1240" cy="115" r="20" fill="#16a34a"/><text x="1240" y="122" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">5</text>
  <text x="1275" y="122" class="step">Combine（回传）与输出</text>
  <rect x="1240" y="164" width="285" height="50" rx="10" fill="#fff" stroke="#86efac"/><text x="1383" y="194" text-anchor="middle" class="body">专家输出回到原 Token 所在 Rank</text>
  <rect x="1240" y="230" width="285" height="62" rx="10" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="1383" y="255" text-anchor="middle" class="body">按 Gate 权重加权求和</text><text x="1383" y="277" text-anchor="middle" class="body">恢复原 Token 顺序</text>
  <rect x="1280" y="315" width="205" height="36" rx="18" fill="#0f766e"/><text x="1383" y="339" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">输出 Token（恢复原顺序）</text>

  <path d="M260 228H300" class="arrow"/><path d="M550 228H590" class="arrow"/><path d="M890 228H930" class="arrow"/><path d="M1165 228H1205" class="arrow"/>
  <rect x="590" y="405" width="970" height="36" rx="18" fill="#fff" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="1075" y="429" text-anchor="middle" class="small">跨 Rank：Dispatch 发送 Token → 专家计算 → Combine 逆向回传；最终输出仍归属原 Token 的 Rank</text>
</svg>
